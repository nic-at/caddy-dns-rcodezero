name: Test Caddy 
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.25"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build Caddy with local DNS module
        run: |
          # Extrahiert den Modulnamen automatisch aus der go.mod
          MODULE_NAME=$(go list -m)
          xcaddy build --with $MODULE_NAME=.

      - name: Generate the Caddyfile
          # A Caddyfile that references the provider (won't actually issue certs in this test)
        run: printf '%s\n' \
          '{' \
          '  email test@example.invalid' \
          '}' \
          '' \
          'example.invalid {' \
          '  tls {' \
          '    dns rcodezero {' \
          '      api_token abc123' \
          '      base_url  https://my.rcodezero.at' \
          '    }' \
          '  }' \
          '  respond "ok"' \
          '}' \
          > /tmp/Caddyfile

      - name: Validate Caddyfile
        run: ./caddy adapt --config /tmp/Caddyfile --adapter caddyfile > /tmp/adapted.json

